<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Class Format Survey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Asynchronous vs In-Person Class Survey</h1>

  <form id="form">
    <!-- Basic info -->
    <div class="form-control">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name" />
    </div>

    <div class="form-control">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" />
    </div>

    <!-- Preference -->
    <div class="form-control">
      <label>Which format do you prefer?</label>
      <label><input type="radio" name="format" value="async"> Asynchronous Online</label>
      <label><input type="radio" name="format" value="inperson"> In-Person</label>
      <label><input type="radio" name="format" value="no-pref"> No Preference</label>
    </div>

    <!-- Reasons -->
    <div class="form-control">
      <label>Why do you prefer that format? (check all that apply)</label>
      <label><input type="checkbox" name="reason" value="flexibility"> Flexibility</label>
      <label><input type="checkbox" name="reason" value="interaction"> Interaction</label>
      <label><input type="checkbox" name="reason" value="resources"> Access to resources</label>
    </div>

    <!-- Comments -->
    <div class="form-control">
      <label for="comment">Any comments?</label>
      <textarea id="comment" placeholder="Enter your comment here"></textarea>
    </div>

    <!-- Submit -->
    <button type="submit">Submit</button>
  </form>
</body>
</html>
